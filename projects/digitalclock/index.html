<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <link rel="stylesheet" type="text/css" href="../styles.css" />
    <title>Your Local Time</title>
    <style>
      body {
        background-color: #212121;
        color: #fff;
      }
      .center {
        display: flex;
        height: 100vh;
        justify-content: center;
        align-items: center;
        flex-direction: column;
      }
      #clock {
        font-size: 40px;
        background-color: orange;
        padding: 20px 50px;
        margin-top: 10px;
        border-radius: 10px;
      }
      nav{
    position: absolute; /* Element ko absolute position dena */
  top: 5px; /* Top par align karna */
  left: 50%; /* Horizontal center */
  transform: translateX(-50%); /* Text ko exactly center karne ke liye */
  font-size: 24px;
  font-weight: bold;
  color: #333;
  }
    </style>
  </head>
  <body>
    <nav>
      <a href="/" aria-current="page">Home</a>
      <a target="_blank" href=""
        >github</a
      >
    </nav>
    <div class="center">
      <div id="banner"><span style="font-size: 24px;">Your local time is</span></div>
      <div id="clock"></div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
